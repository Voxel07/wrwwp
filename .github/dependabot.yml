version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    registries:
      - wpackagist

  - package-ecosystem: "npm"
    directory: "/web/app/themes/wrw"
    schedule:
      interval: "weekly"

registries:
  wpackagist:
    type: composer-repository
    url: https://wpackagist.org
